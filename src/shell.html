<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'"
  />
  <title>DeepSeek Harness</title>
  <style>
    /* 与 DeepSeek Harness 设计平台一致的 token（取自 dsh-client-ui-theme/design-platform.css） */
    :root {
      --ds-bg: #151517;               /* neutral-bluish-950（深色默认） */
      --ds-border: rgba(255, 255, 255, 0.06);
      --ds-text: rgb(235, 238, 242);  /* neutral-bluish-100 */
      --ds-text-dim: rgb(151, 157, 166); /* neutral-bluish-500 */
      --ds-brand: #4176e6;            /* deepseek-500 */
      --ds-hover: rgba(255, 255, 255, 0.08);
      --ds-close-hover: #ef1f1f;      /* red-600 */
      --ds-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
        'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --ds-ease: cubic-bezier(0.4, 0, 0.2, 1);
    }
    body[data-theme="light"] {
      --ds-bg: rgb(255, 255, 255);    /* neutral-bluish-00 */
      --ds-border: rgba(0, 0, 0, 0.06);
      --ds-text: rgb(15, 17, 21);     /* neutral-bluish-1000 */
      --ds-text-dim: rgb(97, 102, 107); /* neutral-bluish-700 */
      --ds-hover: rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--ds-font);
      color: var(--ds-text);
      background: var(--ds-bg);
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* —— 标题栏 —— */
    .titlebar {
      display: flex;
      align-items: center;
      height: 42px;
      flex: none;
      background: var(--ds-bg);
      border-bottom: 1px solid var(--ds-border);
      -webkit-app-region: drag;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 14px;
      flex: 1;
      min-width: 0;
    }
    .logo { width: 20px; height: 20px; display: block; -webkit-user-drag: none; }
    .title {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.2px;
      color: var(--ds-text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* —— 已连接状态 + 断开菜单（标题栏中部） —— */
    .conn {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: none;
      padding: 0 12px;
      -webkit-app-region: no-drag;
    }
    .conn[hidden] { display: none; }
    .conn-url {
      max-width: 340px;
      font-size: 12px;
      color: var(--ds-text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conn-url::before {
      content: '';
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      margin-right: 7px;
      vertical-align: 1px;
    }
    .conn-dd { position: relative; }
    .conn-btn {
      font-size: 12px;
      color: var(--ds-text-dim);
      background: transparent;
      border: 1px solid var(--ds-border);
      border-radius: 7px;
      padding: 4px 10px;
      cursor: pointer;
      transition: background var(--ds-ease) 0.15s, color var(--ds-ease) 0.15s, border-color var(--ds-ease) 0.15s;
      outline: none;
      white-space: nowrap;
    }
    .conn-btn:hover { background: var(--ds-hover); color: var(--ds-text); border-color: var(--ds-brand); }
    .conn-pop {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 230px;
      background: var(--ds-bg);
      border: 1px solid var(--ds-border);
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      padding: 6px;
      z-index: 100;
      display: flex;
      flex-direction: column;
    }
    .conn-pop[hidden] { display: none; }
    .conn-item {
      text-align: left;
      font-size: 12.5px;
      color: var(--ds-text);
      background: transparent;
      border: none;
      border-radius: 7px;
      padding: 8px 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .conn-item:hover { background: var(--ds-hover); }
    .conn-item.danger { color: #ef4444; }
    .conn-item.danger:hover { background: rgba(239, 68, 68, 0.12); }
    .controls {
      display: flex;
      align-items: stretch;
      height: 100%;
      -webkit-app-region: no-drag;
    }
    .controls button {
      width: 46px;
      height: 100%;
      border: none;
      background: transparent;
      color: var(--ds-text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background var(--ds-ease) 0.15s, color var(--ds-ease) 0.15s;
      outline: none;
    }
    .controls button:hover { background: var(--ds-hover); color: var(--ds-text); }
    .controls button.close:hover { background: var(--ds-close-hover); color: #fff; }
    .controls button svg { width: 14px; height: 14px; display: block; }

    /* —— login 界面 —— */
    .login {
      flex: 1;
      min-height: 0;
      display: flex;
    }
    .login-left {
      flex: 0 0 42%;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 40px;
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(65, 118, 230, 0.35), transparent 60%),
        radial-gradient(900px 500px at 110% 110%, rgba(86, 134, 254, 0.25), transparent 55%),
        #151517;
      color: rgb(235, 238, 242);
    }
    .login-logo { width: 132px; height: 132px; -webkit-user-drag: none; filter: drop-shadow(0 12px 40px rgba(65,118,230,0.45)); }
    .login-brand { font-size: 22px; font-weight: 600; letter-spacing: 0.4px; }
    .login-slogan { font-size: 13px; color: rgba(235, 238, 242, 0.55); }

    .login-right {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
      padding: 40px 56px;
      overflow-y: auto;
    }
    .login-h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; color: var(--ds-text); }
    .login-sub { font-size: 13px; color: var(--ds-text-dim); margin: 0 0 8px; }

    .cards { display: flex; flex-direction: column; gap: 10px; }
    .card {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid var(--ds-border);
      border-radius: 12px;
      cursor: pointer;
      transition: border-color 0.15s var(--ds-ease), background 0.15s var(--ds-ease);
      background: transparent;
    }
    .card:hover { background: var(--ds-hover); }
    .card.selected { border-color: var(--ds-brand); background: rgba(65, 118, 230, 0.08); }
    .card input { margin-top: 4px; accent-color: var(--ds-brand); flex: none; }
    .card-title { font-size: 14px; font-weight: 500; color: var(--ds-text); }
    .card-desc { font-size: 12px; color: var(--ds-text-dim); margin-top: 2px; line-height: 18px; }

    .remote-row { display: flex; gap: 8px; }
    .remote-row[hidden] { display: none; }
    .remote-row input {
      flex: 1;
      font-size: 13px;
      padding: 9px 12px;
      border: 1px solid var(--ds-border);
      border-radius: 8px;
      background: transparent;
      color: var(--ds-text);
      outline: none;
    }
    .remote-row input:focus { border-color: var(--ds-brand); }

    .port-row { display: flex; gap: 8px; align-items: center; }
    .port-row[hidden] { display: none; }
    .port-row label {
      font-size: 12.5px;
      color: var(--ds-text-dim);
      flex: none;
    }
    .port-row input {
      width: 130px;
      font-size: 13px;
      padding: 8px 10px;
      border: 1px solid var(--ds-border);
      border-radius: 8px;
      background: transparent;
      color: var(--ds-text);
      outline: none;
    }
    .port-row input:focus { border-color: var(--ds-brand); }
    .port-hint { font-size: 11.5px; color: var(--ds-text-dim); }

    .recent { display: flex; flex-direction: column; gap: 6px; }
    .recent[hidden] { display: none; }
    .recent-title {
      font-size: 12px;
      color: var(--ds-text-dim);
      margin: 4px 0 0;
      letter-spacing: 0.3px;
    }

    .connect {
      align-self: flex-start;
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      background: var(--ds-brand);
      border: none;
      border-radius: 8px;
      padding: 10px 28px;
      cursor: pointer;
      transition: background 0.15s var(--ds-ease);
    }
    .connect:hover { background: #5686fe; }
    .connect:disabled { opacity: 0.55; cursor: default; }

    .status {
      min-height: 22px;
      font-size: 12.5px;
      line-height: 20px;
      color: var(--ds-text-dim);
      white-space: pre-wrap;
      word-break: break-all;
    }
    .status.error { color: #ef4444; }
    .status .inst {
      display: block;
      width: 100%;
      text-align: left;
      border: 1px solid var(--ds-border);
      background: transparent;
      color: var(--ds-text);
      border-radius: 8px;
      padding: 8px 12px;
      margin-top: 6px;
      cursor: pointer;
      font-size: 12.5px;
      font-family: var(--ds-font);
    }
    .status .inst:hover { border-color: var(--ds-brand); background: var(--ds-hover); }
    .status .inst b { color: var(--ds-brand); font-weight: 600; }
  </style>
</head>
<body>
  <div class="titlebar">
    <div class="brand">
      <img class="logo" src="tray.png" alt="" />
      <span class="title">DeepSeek Harness</span>
    </div>
    <div class="conn" id="conn" hidden>
      <span class="conn-url" id="conn-url"></span>
      <div class="conn-dd">
        <button class="conn-btn" id="conn-toggle" title="断开连接">断开连接 ▾</button>
        <div class="conn-pop" id="conn-pop" hidden>
          <button class="conn-item" id="conn-disconnect">断开连接（返回登录界面，服务保持运行）</button>
          <button class="conn-item danger" id="conn-disconnect-stop" hidden>断开连接并关闭本地服务</button>
        </div>
      </div>
    </div>
    <div class="controls">
      <button id="min" title="最小化" aria-label="最小化">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
          <line x1="2" y1="7" x2="12" y2="7" />
        </svg>
      </button>
      <button id="max" title="最大化" aria-label="最大化">
        <svg class="ico-max" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2">
          <rect x="3" y="3" width="8" height="8" rx="1" />
        </svg>
        <svg class="ico-restore" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" style="display:none">
          <path d="M4 4h6v6" />
          <rect x="2.5" y="2.5" width="6" height="6" rx="1" />
        </svg>
      </button>
      <button id="close" class="close" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
          <line x1="3" y1="3" x2="11" y2="11" />
          <line x1="11" y1="3" x2="3" y2="11" />
        </svg>
      </button>
    </div>
  </div>

  <div class="login" id="login">
    <div class="login-left">
      <img class="login-logo" src="whale-white.svg" alt="DeepSeek" />
      <div class="login-brand">DeepSeek Harness</div>
      <div class="login-slogan">本地 · 智能 · 属于你的 Agent 工作台</div>
    </div>
    <div class="login-right">
      <h1 class="login-h1">连接 DeepSeek Harness</h1>
      <p class="login-sub">选择你要连接的服务器</p>
      <div class="cards" id="cards">
        <label class="card selected">
          <input type="radio" name="method" value="sniff" checked />
          <div>
            <div class="card-title">本地嗅探</div>
            <div class="card-desc">探测本机已运行的 DeepSeek Harness Web 服务</div>
          </div>
        </label>
        <label class="card">
          <input type="radio" name="method" value="local" />
          <div>
            <div class="card-title">GUI 启动本地服务器</div>
            <div class="card-desc">由本应用启动并接管一个本地 DeepSeek Harness</div>
          </div>
        </label>
        <label class="card">
          <input type="radio" name="method" value="remote" />
          <div>
            <div class="card-title">云端服务器</div>
            <div class="card-desc">连接远程的 DeepSeek Harness Web 服务</div>
          </div>
        </label>
      </div>
      <div class="remote-row" id="remote-row" hidden>
        <input id="remote-url" type="text" spellcheck="false" placeholder="https://your-dsh.example.com" />
      </div>
      <div class="port-row" id="port-row" hidden>
        <label for="local-port">端口</label>
        <input id="local-port" type="text" inputmode="numeric" spellcheck="false" placeholder="随机" />
        <span class="port-hint">留空自动选择随机端口</span>
      </div>
      <div class="recent" id="recent" hidden></div>
      <button id="connect" class="connect">连接</button>
      <div class="status" id="status"></div>
    </div>
  </div>

  <script>
    (function () {
      // —— 主题：初始从 query 读取，运行时由主进程推送 ——
      function applyTheme(isDark) {
        document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
      }
      var params = new URLSearchParams(location.search);
      applyTheme(params.get('dark') === '1');
      if (window.shellWindow && window.shellWindow.onThemeChange) {
        window.shellWindow.onThemeChange(function (isDark) { applyTheme(isDark); });
      }

      // —— 窗口控制 ——
      var max = document.getElementById('max');
      var icoMax = max.querySelector('.ico-max');
      var icoRestore = max.querySelector('.ico-restore');
      document.getElementById('min').addEventListener('click', function () { window.shellWindow.minimize(); });
      max.addEventListener('click', function () { window.shellWindow.toggleMaximize(); });
      document.getElementById('close').addEventListener('click', function () { window.shellWindow.close(); });
      window.shellWindow.onMaximizeChange(function (isMax) {
        icoMax.style.display = isMax ? 'none' : 'block';
        icoRestore.style.display = isMax ? 'block' : 'none';
      });

      // —— 已连接状态 + 断开连接菜单 ——
      var connEl = document.getElementById('conn');
      var connUrlEl = document.getElementById('conn-url');
      var connPop = document.getElementById('conn-pop');
      var connToggle = document.getElementById('conn-toggle');
      var connDisconnect = document.getElementById('conn-disconnect');
      var connDisconnectStop = document.getElementById('conn-disconnect-stop');
      function closeConnPop() { connPop.hidden = true; }
      window.shellWindow.onConnectionChange(function (s) {
        connEl.hidden = !s.connected;
        connUrlEl.textContent = s.url || '';
        connDisconnectStop.hidden = !s.owned;
        closeConnPop();
      });
      connToggle.addEventListener('click', function (e) {
        e.stopPropagation();
        connPop.hidden = !connPop.hidden;
      });
      connDisconnect.addEventListener('click', function () {
        closeConnPop();
        window.shellWindow.disconnect();
      });
      connDisconnectStop.addEventListener('click', function () {
        closeConnPop();
        window.shellWindow.disconnectAndClose();
      });
      document.addEventListener('click', function () { closeConnPop(); });

      // —— login 交互 ——
      var cards = document.getElementById('cards');
      var remoteRow = document.getElementById('remote-row');
      var remoteUrl = document.getElementById('remote-url');
      var portRow = document.getElementById('port-row');
      var localPort = document.getElementById('local-port');
      var connectBtn = document.getElementById('connect');
      var statusEl = document.getElementById('status');

      function currentMethod() {
        var r = cards.querySelector('input[name=method]:checked');
        return r ? r.value : 'sniff';
      }
      function setStatus(text, isError) {
        statusEl.className = 'status' + (isError ? ' error' : '');
        statusEl.textContent = '';
        if (text) statusEl.textContent = text;
      }
      function renderInstances(list) {
        statusEl.className = 'status';
        statusEl.textContent = '';
        if (!list || list.length === 0) {
          statusEl.textContent = '未发现正在运行的实例。可以试试「GUI 启动本地服务器」，或确认 dsh web 已启动。';
          return;
        }
        var hint = document.createElement('div');
        hint.textContent = '发现 ' + list.length + ' 个实例，点击连接：';
        statusEl.appendChild(hint);
        list.forEach(function (inst) {
          var b = document.createElement('button');
          b.className = 'inst';
          b.textContent = '已检测到 DeepSeek Harness — ' + inst.url;
          b.addEventListener('click', function () { window.shellWindow.login.joinRemote(inst.url); });
          statusEl.appendChild(b);
        });
      }

      function setBusy(busy) {
        connectBtn.disabled = busy;
        connectBtn.textContent = busy ? '连接中…' : '连接';
      }

      // —— 最近连接 ——
      var recentEl = document.getElementById('recent');
      function renderRecent(list) {
        recentEl.textContent = '';
        recentEl.hidden = !list || list.length === 0;
        if (!list || list.length === 0) return;
        var title = document.createElement('div');
        title.className = 'recent-title';
        title.textContent = '最近连接（点击重连）';
        recentEl.appendChild(title);
        list.forEach(function (url) {
          var b = document.createElement('button');
          b.className = 'inst';
          b.textContent = url;
          b.addEventListener('click', function () { window.shellWindow.login.joinRemote(url); });
          recentEl.appendChild(b);
        });
      }
      window.shellWindow.login.onRecentResult(renderRecent);
      window.shellWindow.login.requestRecent();

      cards.addEventListener('change', function () {
        var m = currentMethod();
        cards.querySelectorAll('.card').forEach(function (l) {
          l.classList.toggle('selected', l.querySelector('input').checked);
        });
        remoteRow.hidden = m !== 'remote';
        portRow.hidden = m !== 'local';
        setStatus('');
        if (m === 'sniff') {
          setStatus('正在嗅探本地实例…');
          window.shellWindow.login.sniff();
        }
      });

      connectBtn.addEventListener('click', function () {
        var m = currentMethod();
        if (m === 'sniff') {
          setStatus('正在嗅探本地实例…');
          window.shellWindow.login.sniff();
        } else if (m === 'local') {
          setBusy(true);
          setStatus('正在启动本地 DeepSeek Harness…');
          window.shellWindow.login.startLocal(localPort.value.trim());
        } else if (m === 'remote') {
          var url = remoteUrl.value.trim();
          if (!url) {
            setStatus('请输入云端服务器地址', true);
            return;
          }
          setBusy(true);
          setStatus('正在连接 ' + url + ' …');
          window.shellWindow.login.joinRemote(url);
        }
      });

      remoteUrl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') connectBtn.click();
      });
      localPort.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') connectBtn.click();
      });

      // 主进程推送
      window.shellWindow.login.onSniffResult(function (list) {
        if (currentMethod() !== 'sniff') return;
        renderInstances(list);
      });
      window.shellWindow.login.onProgress(function (msg) {
        if (currentMethod() !== 'local') return;
        setStatus(msg);
      });
      window.shellWindow.login.onResult(function (r) {
        setBusy(false);
        if (r && r.ok) {
          setStatus('连接成功');
        } else {
          setStatus((r && r.error) || '连接失败', true);
        }
      });
      window.shellWindow.login.onVisible(function (v) {
        document.getElementById('login').style.display = v ? 'flex' : 'none';
      });

      // 默认选中嗅探：启动即开始一次
      window.shellWindow.login.sniff();
    })();
  </script>
</body>
</html>
