# 发布 CI：打 tag 时构建三平台产物并上传到 GitHub Release。
# 用法（推送到 GitHub 后）：
#   1. 把下方 owner/repo 填进 electron-builder.yml 的 publish.github（或用本文件的 env）。
#   2. 配置 secrets：GH_TOKEN（或 GITHUB_TOKEN 自动可用，但发布到 Release 需
#      `permissions: contents: write`，私有仓库还需带 token 的 PAT）。
#   3. macOS 签名/公证：设置 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
#      APPLE_TEAM_ID，并开启 CSC_LINK/CSC_KEY_PASSWORD（或暂不签名发布）。
#   4. git tag v0.5.1 && git push origin v0.5.1
#
# 注意发布权：electron-builder 完全不碰 GitHub（三平台一律 --publish never）。
# Release 由 Windows job 的 gh release create 显式创建（唯一创建点），各平台
# 产物用 gh release upload 按 tag 附加。三个踩过的坑：
# 1) electron-builder 的发布逻辑会「按 tag 查找 Release、找不到就新建」，
#    查找偶发落空就造出第二个同 tag Release（v0.5.0 事故，needs: 挡不住）；
# 2) CI 的 tag 构建下 --publish 缺省是 onTag——光删掉 --publish always 并
#    不能阻止它自行发布（v1.0.1 事故），必须显式 never；
# 3) 就算只有 Windows job 用 --publish always，它内部的并行上传任务也会
#    竞态创建出两个 Release 对象（v1.0.0/v1.0.1/v1.0.2 三连，第二对象
#    总是装着 Setup blockmap）。所以发布只能走 gh：create 一次 + upload --clobber。
# gh release upload 找不到 Release 会直接报错失败，绝不会悄悄新建；
# --clobber 支持重跑覆盖。产物名见 electron-builder.yml：一律连字符
# （GitHub 把资产名里的空格替换成点号，与 latest.yml 的连字符引用错位）。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        # 唯一的 Release 创建点（幂等：重跑时已存在则跳过）。
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME"

      - name: Build & package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 只构建不发布（发布权归 gh release create，见文件头注释）。
        run: npx electron-builder --win --publish never

      - name: Attach to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            release/*.exe \
            release/*.exe.blockmap \
            release/latest.yml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          # upload-artifact 的 glob 不支持 {} 花括号展开（一条多模式会静默匹配 0 个文件）
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: ignore

  build-macos:
    needs: build-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build & package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 签名/公证（可选，未配置则输出未签名产物）：
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # 只构建不发布（发布权在 build-windows，见文件头注释）。注意必须显式
        # never：CI 的 tag 构建下 --publish 缺省是 onTag，electron-builder 仍会
        # 自行发布并可能另建 Release（v1.0.1 第二次事故）。
        run: npx electron-builder --mac --publish never

      - name: Attach to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            release/*.dmg \
            release/*.zip \
            release/*.dmg.blockmap \
            release/*.zip.blockmap \
            release/latest-mac.yml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: ignore

  build-linux:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build & package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 只构建不发布（发布权在 build-windows，见文件头注释）。同样必须显式
        # never：CI 的 tag 构建下 --publish 缺省是 onTag。
        run: npx electron-builder --linux --publish never

      - name: Attach to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            release/*.AppImage \
            release/*.deb \
            release/latest-linux.yml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: ignore
